[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mingjian"
version = "1.0.0"
description = "明鉴 · 产业情报：输入公司名，自动采集、抽取、比对、成稿并留痕，每条结论可翻回原文"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MingJian Contributors" }]
keywords = [
  "industry-intelligence",
  "competitive-intelligence",
  "evidence-traceability",
  "fastapi",
  "vue3",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Natural Language :: Chinese (Simplified)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8.0",
]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["PyMySQL>=1.1"]

[project.scripts]
mingjian = "mingjian.cli:main"

[project.urls]
Homepage = "https://github.com/yiyangtime/mingjian"
Issues = "https://github.com/yiyangtime/mingjian/issues"
Changelog = "https://github.com/yiyangtime/mingjian/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["mingjian*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv", "web", "tools/selftest_samples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]