name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（Python ${{ matrix.python }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 安装
        run: python -m pip install -e ".[dev]"
      - name: 静态检查
        run: python -m ruff check .
      - name: 全量自测（33 项）
        run: python tools/selftest_all.py
      - name: 架构边界与体积棘轮
        run: python tools/selftest_arch.py

  frontend:
    name: 前端（Node 20）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装
        run: npm ci
      - name: 类型检查与构建
        run: npm run build

  smoke:
    name: 服务冒烟
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装运行时依赖
        run: python -m pip install -r requirements.txt
      - name: 启动服务并检查健康接口
        run: |
          python -m mingjian serve --port 8765 --no-open &
          for i in $(seq 1 20); do
            sleep 1
            if curl -fsS http://127.0.0.1:8765/api/health; then
              echo ""
              echo "服务已就绪"
              exit 0
            fi
          done
          echo "服务未在 20 秒内就绪"
          exit 1