name: 功能建议
description: 提出新能力或改进方向
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述场景，而不是直接给方案
      placeholder: 非上市竞品的覆盖只有公开资讯，想补充招投标公告来源……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议做法
      description: 如果有实现思路，说明改哪一层（api / services / infra / web）
  - type: dropdown
    id: layer
    attributes:
      label: 影响范围
      options:
        - 数据源接入
        - 抽取与判定规则
        - 报告与成稿
        - 前端页面
        - 运行治理（调度 / 检查点 / 审计）
        - 文档与工程
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 是否影响「可追溯」约束
      description: 新能力如果产出事实，是否每一条都能给出来源与证据句？给出你的设计
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 自查
      options:
        - label: 已搜索现有 issue，没有重复
        - label: 没有引入真实公司数据作为示例